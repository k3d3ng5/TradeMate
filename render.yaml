services:
  - type: web
    name: trademate-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: TRADEMATE_HOST
        value: 0.0.0.0
      - key: TRADEMATE_MARKET_SOURCE
        value: binance
      - key: TRADEMATE_COOKIE_SECURE
        value: "true"
      - key: TRADEMATE_DATABASE_URL
        sync: false
      - key: TRADEMATE_ADMIN_EMAIL
        sync: false
      - key: TRADEMATE_ADMIN_PASSWORD
        sync: false
